name: Weekly Project Board Report

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 AM UTC (8:00 AM SAST)
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_NUMBER: "7" # 👈 Replace with your project number from Step 1
          PROJECT_OWNER: "your-org-or-username" # 👈 Replace with your GitHub org or username
          OWNER_TYPE: "organization" # 👈 Use "user" if it's a personal account, "organization" if org
        run: |
          node .github/scripts/generate-report.js > report.txt
          echo "Report generated"

      - name: Send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: |
          REPORT_BODY=$(cat report.txt)
          node -e "
            const nodemailer = require('nodemailer');
            const fs = require('fs');

            const transporter = nodemailer.createTransport({
              service: 'gmail',
              auth: {
                user: process.env.GMAIL_USER,
                pass: process.env.GMAIL_APP_PASSWORD,
              },
            });

            const body = fs.readFileSync('report.txt', 'utf8');

            transporter.sendMail({
              from: process.env.GMAIL_USER,
              to: process.env.REPORT_RECIPIENT,
              subject: 'Weekly Avecs Support Board Report',
              text: body,
            }, (err, info) => {
              if (err) { console.error(err); process.exit(1); }
              console.log('Email sent:', info.response);
            });
          "

      - name: Install nodemailer
        run: npm install nodemailer
