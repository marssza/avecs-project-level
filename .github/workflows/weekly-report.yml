name: Weekly Project Board Report

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6:00 AM UTC (8:00 AM SAST)
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROJECT_NUMBER: "2" # 👈 Replace with your project number from Step 1
          PROJECT_OWNER: "marssza" # 👈 Replace with your GitHub org or username
          OWNER_TYPE: "user" # 👈 Use "user" if it's a personal account, "organization" if org
        run: |
          node .github/scripts/generate-report.js > report.txt
          echo "Report generated"
      
      - name: Install nodemailer
        run: npm install nodemailer

      - name: Send email via Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: node .github/scripts/send-email.js
